# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] 最初のコミット"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] 仕様の明確化の前に保存"
  before_plan:
    enabled: false
    message: "[Spec Kit] 計画の前に保存"
  before_tasks:
    enabled: false
    message: "[Spec Kit] タスク作成の前に保存"
  before_implement:
    enabled: false
    message: "[Spec Kit] 実装の前に保存"
  before_checklist:
    enabled: false
    message: "[Spec Kit] チェックリスト作成の前に保存"
  before_analyze:
    enabled: false
    message: "[Spec Kit] 分析の前に保存"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Issue への同期の前に保存"
  after_constitution:
    enabled: false
    message: "[Spec Kit] プロジェクトの原則を追加"
  after_specify:
    enabled: false
    message: "[Spec Kit] 仕様を追加"
  after_clarify:
    enabled: false
    message: "[Spec Kit] 仕様を明確化"
  after_plan:
    enabled: false
    message: "[Spec Kit] 実装計画を追加"
  after_tasks:
    enabled: false
    message: "[Spec Kit] タスクを追加"
  after_implement:
    enabled: false
    message: "[Spec Kit] 実装の途中経過"
  after_checklist:
    enabled: false
    message: "[Spec Kit] チェックリストを追加"
  after_analyze:
    enabled: false
    message: "[Spec Kit] 分析の結果を追加"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] タスクを Issue に同期"
